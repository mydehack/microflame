[package]
name = "flame-in-freefall"
version = "2.4.0"
description = "AI-Assisted Scientific Combustion Research and Microgravity Simulation Application"
authors = ["Flame in Freefall Research Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

